<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#e2e8f0"/>
  <image href="https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=600&q=60" x="0" y="0" width="400" height="300" preserveAspectRatio="xMidYMid slice" filter="url(#grey)"/>
  <defs>
    <filter id="grey">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect x="120" y="120" width="160" height="60" rx="8" fill="rgba(0,0,0,0.5)"/>
  <text x="200" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="white" font-weight="600">No Image</text>
  <text x="200" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">Available</text>
</svg>
